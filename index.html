    #sidebar {

      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow-y: auto; /* 启用垂直滚动条 */
    }
    #sidebar h3 {
      margin-top: 0;
    }
    #sidebar ul {
      list-style: none;
      padding: 0;
    }
    #sidebar li {
      margin-bottom: 10px;
      cursor: pointer;
    }
